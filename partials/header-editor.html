<header class="topbar">
  <a href="{{href|index.html}}" class="brand">
    <div class="brand-icon">
{{#icon=back}}
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
{{/}}
{{^icon=back}}
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
        <line x1="6" y1="17" x2="18" y2="17"/>
      </svg>
{{/}}
    </div>
    <div>
      <div class="brand-title">Mutfaktan Yarına</div>
      <div class="brand-sub">{{sub}}</div>
    </div>
  </a>
{{#session}}
  <nav class="admin-top-menu" id="adminTopMenu" aria-label="Yönetim Menüsü">
    <a href="editor-panel.html" class="admin-menu-link"{{aria:editor}} id="navEditorPanel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      <span>Başvuru Masası</span>
    </a>
    <a href="admin-kullanicilar.html" class="admin-menu-link"{{aria:admin}} id="navAdminUsers" data-admin-only hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Kullanıcı Yönetimi</span>
    </a>
    <a href="admin-sistem.html" class="admin-menu-link"{{aria:system}} data-admin-only hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Sistem ve Takvim</span>
    </a>
    <a href="admin-denetim.html" class="admin-menu-link"{{aria:audit}} data-admin-only hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Denetim Kayıtları</span>
    </a>
  </nav>
{{/}}
  <div class="editor-identity">
    <span class="role-badge"{{id:badgeid}}>{{badge}}</span>
{{#session}}
    <div class="editor-info">
      <span class="editor-name" id="currentEditorName"></span>
      <span class="editor-mail" id="currentEditorMail"></span>
    </div>
    <a href="giris.html" class="btn-logout" id="btnLogout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Çıkış</span>
    </a>
{{/}}
  </div>
</header>
